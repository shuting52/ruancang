<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="软仓">
  <defs>
    <!-- NEU 柔影：左上白高光 + 右下柔影蓝阴影，与所给 HTML 主题同源 -->
    <filter id="softUp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="-6" stdDeviation="18" flood-color="#ffffff" flood-opacity="0.95"/>
      <feDropShadow dx="10" dy="6" stdDeviation="18" flood-color="#5f9de7" flood-opacity="0.48"/>
    </filter>
    <filter id="softDown" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="-2" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.95"/>
      <feDropShadow dx="4" dy="2" stdDeviation="10" flood-color="#5f9de7" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc3ef"/>
      <stop offset="0.6" stop-color="#5f9de7"/>
      <stop offset="1" stop-color="#3f7fc4"/>
    </linearGradient>
  </defs>

  <!-- 画布底色：与主题 --bg 一致，导出为启动器图标时请裁掉这一层，只留圆角 tile -->
  <rect width="512" height="512" fill="#e0e8ef"/>

  <!-- 主 tile：柔影凸起卡片 -->
  <g filter="url(#softUp)">
    <rect x="56" y="56" width="400" height="400" rx="112" fill="#e0e8ef"
          stroke="rgba(255,255,255,0.333)" stroke-width="4"/>
  </g>

  <!-- 内凹槽：放“软”字，呼应主题 .nin / .nprogress 的 inset 阴影 -->
  <g filter="url(#softDown)">
    <rect x="104" y="104" width="304" height="304" rx="84" fill="#e0e8ef"
          stroke="rgba(255,255,255,0.333)" stroke-width="3"/>
  </g>

  <!-- 核心：“软”字。字体回退链保证在大多数系统上都能正确渲染；
       导入 Android Studio Vector Asset 前，建议先在 Illustrator / Figma 里把文字转曲（Create Outlines）。 -->
  <text x="256" y="332" text-anchor="middle"
        font-family="'Source Sans 3','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"
        font-size="228" font-weight="700" fill="url(#blueGrad)" letter-spacing="2">软</text>

  <!-- 右下角“仓”的点缀：金色小圆点，取自主题 --gold #f0a93c -->
  <circle cx="372" cy="372" r="18" fill="#f0a93c" stroke="rgba(255,255,255,0.6)" stroke-width="4"/>
  <circle cx="372" cy="372" r="7" fill="#ffffff"/>

  <!-- 底部小字：仅用于品牌展示版，作启动器图标时可删 -->
  <!-- <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="20" letter-spacing="10" fill="#7e97b8">RUANCANG</text> -->
</svg>
